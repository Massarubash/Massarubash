.t2{font:800 52px 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:3px;animation:track 2.4s .25s cubic-bezier(.16,.84,.24,1) both}
@keyframes track{from{letter-spacing:30px;opacity:0}to{letter-spacing:3px;opacity:1}}
.fade{animation:fi 1.3s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}
</style></defs>
